---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
  labels:
    name: jenkins
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: jenkins
  namespace: flux-system
spec:
  timeout: 10m
  interval: 3m
  releaseName: jenkins
  targetNamespace: jenkins
  chart:
    spec:
      chart: flux/charts/jenkins
      sourceRef:
        kind: GitRepository
        name: clusty-dusty-charts
  values:
