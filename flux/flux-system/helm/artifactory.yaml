---
apiVersion: v1
kind: Namespace
metadata:
  name: artifactory
  labels:
    name: artifactory
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: artifactory
  namespace: artifactory
spec:
  interval: 3m
  releaseName: artifactory
  targetNamespace: artifactory
  dependsOn:
  - name: gitlab
  chart:
    spec:
      chart: flux/charts/artifactory
      sourceRef:
        kind: GitRepository
        name: clusty-dusty-charts
  values:
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    # add an annotation indicating the issuer to use.
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: artifactory
  namespace: artifactory
spec:
  rules:
  - host: artifactory.gerardosalazar.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
          # TODO: Fill this in with the actual artifactory UI
            name: 
            port:
              number: 
  tls: # < placing a host in the TLS config will determine what ends up in the cert's subjectAltNames
  - hosts:
    - artifactory.gerardosalazar.com
    secretName: artifactory-cert # < cert-manager will store the created certificate in this secret.