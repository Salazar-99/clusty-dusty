    name: longhorn-system
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 3m
  releaseName: longhorn
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: flux/charts/longhorn
      sourceRef:
        kind: GitRepository
        name: clusty-dusty-charts
  values: