---
- name: Prepare all nodes
  hosts: optiplex
  become: true
  gather_facts: true
  roles:
  - role: k8s-node

- name: Install RKE on servers
  hosts: servers
  become: true
  roles:
  - role: server

- name: Install RKE on agents and join them to the cluster
  hosts: agents
  become: true
  roles:
  - role: agent

- name: Update local kubeconfig
  hosts: 127.0.0.1
  connection: local
  tasks:
  - name: Update local kubeconfig
    shell:
      cmd: "sed -i 's/127.0.0.1/{{ hostvars[groups['servers'][0]]['ansible_default_ipv4']['address'] }}/g' ~/.kube/config"

